<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自动驾驶赛道设计器 · Autonomous Track Designer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 L27 9 V23 L16 29 L5 23 V9 Z' fill='none' stroke='%2328d4ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2328d4ee'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部工具栏 -->
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
      <path d="M16 3 L27 9 V23 L16 29 L5 23 V9 Z" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <circle cx="16" cy="16" r="4.2" fill="var(--accent)"/>
      <path d="M16 3 V11.8 M27 9 L19 14 M27 23 L19 18 M16 29 V20.2 M5 23 L13 18 M5 9 L13 14" stroke="var(--accent-soft)" stroke-width="1.2"/>
    </svg>
    <div class="brand-text">
      <strong>自动驾驶赛道设计器</strong>
      <span>AUTONOMOUS TRACK DESIGNER</span>
    </div>
  </div>

  <div class="track-name-box">
    <input id="track-name" type="text" placeholder="未命名赛道" maxlength="64">
  </div>

  <div class="toolbar-actions">
    <button class="btn" id="btn-undo" title="撤销 Ctrl+Z">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h11a5 5 0 015 5v0a5 5 0 01-5 5h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      撤销
    </button>
    <button class="btn" id="btn-redo" title="重做 Ctrl+Y">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 14l5-5-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H9a5 5 0 00-5 5v0a5 5 0 005 5h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      重做
    </button>
    <span class="divider"></span>
    <button class="btn btn-toggle active" id="btn-road-layer" title="显示 / 隐藏道路图层（快捷键 R）">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3 3 8l9 5 9-5-9-5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity=".55"/></svg>
      道路图层
    </button>
    <span class="divider"></span>
    <button class="btn" id="btn-import">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      导入JSON
    </button>
    <button class="btn" id="btn-export">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 15V3m0 0L8 7m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      导出JSON
    </button>
    <button class="btn" id="btn-load">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      加载
    </button>
    <button class="btn btn-primary" id="btn-save">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 3h11l3 3v15H5z M8 3v5h7 M8 21v-7h8v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      保存
    </button>
    <button class="btn btn-danger-ghost" id="btn-clear" title="清空画布">清空</button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
  </div>
</header>

<main class="workspace">

  <!-- 左侧面板：元素库 / 场景中元素统计（Tab 切换） -->
  <aside class="panel palette" id="palette">
    <div class="panel-tabs">
      <button class="panel-tab active" id="tab-palette" data-tab="palette">元素库</button>
      <button class="panel-tab" id="tab-stats" data-tab="stats">场景中元素统计</button>
    </div>
    <div class="palette-groups" id="palette-groups"><!-- JS 渲染 --></div>
    <div class="stats-body" id="stats-body" hidden><!-- JS 渲染 --></div>
  </aside>

  <!-- 中间画布 -->
  <section class="canvas-wrap" id="canvas-wrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="grid-small" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0H0V20" fill="none" stroke="rgba(90,150,220,0.10)" stroke-width="1"/>
        </pattern>
        <pattern id="grid-large" width="100" height="100" patternUnits="userSpaceOnUse">
          <rect width="100" height="100" fill="url(#grid-small)"/>
          <path d="M100 0H0V100" fill="none" stroke="rgba(90,150,220,0.20)" stroke-width="1"/>
        </pattern>
        <radialGradient id="canvas-glow" cx="50%" cy="45%" r="70%">
          <stop offset="0%" stop-color="#0f2a52"/>
          <stop offset="100%" stop-color="#071327"/>
        </radialGradient>
      </defs>
      <rect id="canvas-bg" x="0" y="0" width="4000" height="3000" fill="url(#canvas-glow)"/>
      <rect id="canvas-grid" x="0" y="0" width="4000" height="3000" fill="url(#grid-large)"/>
      <g id="viewport">
        <g id="layer-elements"></g>
        <g id="layer-overlay"></g>
      </g>
    </svg>

    <div class="canvas-hud">
      <div class="hud-group">
        <button class="hud-btn" id="zoom-out" title="缩小">−</button>
        <span id="zoom-level">100%</span>
        <button class="hud-btn" id="zoom-in" title="放大">＋</button>
        <button class="hud-btn" id="zoom-fit" title="复位视图">⌂</button>
      </div>
    </div>
    <div class="canvas-tip" id="canvas-tip">从左侧元素库拖拽元素到此处开始设计</div>
  </section>

  <!-- 右侧属性面板 -->
  <aside class="panel inspector" id="inspector">
    <div class="panel-title">属性</div>
    <div id="inspector-body">
      <div class="inspector-empty">
        <svg viewBox="0 0 24 24" width="40" height="40"><path d="M12 2l2.4 6.9H22l-6 4.4 2.3 7.2L12 16.2 5.7 20.5 8 13.3 2 8.9h7.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <p>选中画布中的元素<br>在此编辑其参数</p>
      </div>
    </div>
  </aside>
</main>

<!-- 底部状态栏 -->
<footer class="statusbar">
  <span id="status-count">元素 0</span>
  <span id="status-pos">X 0 · Y 0</span>
  <label class="snap-toggle">
    <input type="checkbox" id="snap-check" checked> 网格吸附
  </label>
  <span class="spacer"></span>
  <span class="status-hint">Delete 删除 · Ctrl+D 复制 · 方向键微调 · 空白拖拽框选 · 右键组合/取消组合 · 中键/空格平移 · 滚轮缩放</span>
</footer>

<!-- 加载赛道弹窗 -->
<div class="modal-mask" id="modal-load" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>加载赛道</h3>
      <button class="modal-close" data-close="modal-load">×</button>
    </div>
    <div class="modal-body" id="load-list"></div>
  </div>
</div>

<!-- 导入 JSON 弹窗（默认来自 tracks/ 目录） -->
<div class="modal-mask" id="modal-import" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>导入 JSON · tracks/ 目录</h3>
      <button class="modal-close" data-close="modal-import">×</button>
    </div>
    <div class="modal-body" id="import-list"></div>
    <div class="modal-foot">
      <button class="btn" id="btn-import-local">从本地文件选择…</button>
      <button class="btn" data-close="modal-import">取消</button>
    </div>
  </div>
</div>

<!-- 保存命名弹窗 -->
<div class="modal-mask" id="modal-save" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>保存赛道到服务器</h3>
      <button class="modal-close" data-close="modal-save">×</button>
    </div>
    <div class="modal-body">
      <label class="form-label">赛道名称</label>
      <input type="text" class="form-input" id="save-name" maxlength="64" placeholder="例如：港口测试环路01">
      <p class="form-hint">同名赛道将被覆盖；也可使用“导出JSON”保存到本地。</p>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="modal-save">取消</button>
      <button class="btn btn-primary" id="confirm-save">确认保存</button>
    </div>
  </div>
</div>

<!-- 全局提示 -->
<div class="toast-wrap" id="toast-wrap"></div>

<script src="js/elements.js"></script>
<script src="js/canvas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
